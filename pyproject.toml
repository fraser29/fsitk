[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fsitk"
version = "0.0.1"
description = "FMC SimpleITK"
readme = "README.md"
requires-python = ">=3.9.0"
keywords = ["imaging", "registration", "segmentation"]
authors = [
    { name = "Fraser M. Callaghan", email = "callaghan.fm@gmail.com" }
]
dependencies = [
    "SimpleITK",
    "ngawari",
    "VTK",
    "numpy",
    "matplotlib"
]


[tool.hatch.build.targets.wheel]
packages = ["fsitk"] 